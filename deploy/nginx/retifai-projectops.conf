# ReTiFai ProjectOps - nginx reverse proxy site
#
# Deployment model on the UGREEN NAS (nginx is already installed/running):
#   - nginx serves the built React SPA (static files from dist/) directly.
#   - nginx reverse-proxies API traffic under /api/ to the FastAPI backend
#     (uvicorn) listening on 127.0.0.1:8000.
#
# The /api/ -> backend mapping strips the /api prefix, mirroring the Vite dev
# proxy in vite.config.ts, so the backend keeps serving routes at the root
# (e.g. a browser request to /api/projects reaches the backend as /projects).
#
# Adjust the values marked "EDIT:" for your NAS, then enable the site and
# reload nginx (see README "Production Deployment on a UGREEN NAS").

server {
    listen 80;

    # EDIT: set to the NAS hostname or IP used to reach the app.
    server_name projectops.local;

    # EDIT: absolute path to the built frontend (contents of the repo's dist/).
    root /srv/retifai-projectops/dist;
    index index.html;

    # Allow larger uploads (attachments: PDF/DOCX/XLSX/images).
    client_max_body_size 50m;

    # Static SPA assets with client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. The trailing slash on proxy_pass strips the /api
    # prefix before forwarding to the backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interactive API docs (optional; comment out to keep docs private).
    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
